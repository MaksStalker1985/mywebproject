# TechVault: nginx → /etc/nginx/sites-available/django-site (install.sh подставляет домен вместо example.com).
# HTTPS (порт 443 и редирект с 80) добавляет certbot: certbot --nginx -d example.com
# Строка «TechVault» выше — отметка для install.sh: свой конфиг он не перезаписывает.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Загрузка установочных файлов через панель управления
    client_max_body_size 2G;
    client_body_timeout 300s;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /static/ {
        alias /var/www/django-site/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Публичные загрузки: обложки и аватары
    location /media/covers/ {
        alias /var/www/django-site/media/covers/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/avatars/ {
        alias /var/www/django-site/media/avatars/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    # Всё остальное в media (в т.ч. установочные файлы платных игр) напрямую недоступно
    location /media/ {
        return 404;
    }

    # Скачивание: Django проверяет покупку и отвечает X-Accel-Redirect на этот адрес
    location /protected-media/ {
        internal;
        alias /var/www/django-site/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/django-site.sock;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
