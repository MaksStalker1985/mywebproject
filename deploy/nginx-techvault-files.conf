# TechVault: отдача больших файлов. Ставится в /etc/nginx/conf.d/techvault-files.conf (install.sh, update.sh).
# sendfile и tcp_nopush уже включены в стандартном /etc/nginx/nginx.conf Ubuntu.
# Чтение с диска — в отдельных потоках, чтобы медленные закачки не блокировали nginx.
# directio здесь не используется: на дисках с сектором 4 КБ он ломает отдачу файлов больше порога
# (pread() failed (22: Invalid argument)).
aio threads;
sendfile_max_chunk 2m;
