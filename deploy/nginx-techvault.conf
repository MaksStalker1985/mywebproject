# nginx: /etc/nginx/sites-available/techvault (install.sh подставляет домен вместо example.com).
# HTTPS (порт 443 и редирект с 80) добавляет certbot: certbot --nginx -d example.com

upstream techvault_app {
    server unix:/run/techvault/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Загрузка установочных файлов через панель управления
    client_max_body_size 2G;
    client_body_timeout 300s;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /static/ {
        alias /srv/techvault/static/;
        expires 30d;
        access_log off;
    }

    # Публичные загрузки: обложки и аватары
    location /media/covers/ {
        alias /srv/techvault/media/covers/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/avatars/ {
        alias /srv/techvault/media/avatars/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    # Всё остальное в media (в т.ч. установочные файлы платных игр) напрямую недоступно
    location /media/ {
        return 404;
    }

    # Скачивание: Django проверяет покупку и отвечает X-Accel-Redirect на этот адрес
    location /protected-media/ {
        internal;
        alias /srv/techvault/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://techvault_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
